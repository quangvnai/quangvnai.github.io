# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/

# Appearance
appearance:
  mode: system
  # Custom theme defined in `assets/css/themes/ink.css`
  color: ink

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: 'University of Wollongong'
    description: 'Quang Nguyen (Van-Quang Nguyen) — AI researcher at the University of Wollongong, previously RIKEN AIP and Tohoku University, working on multimodal large language models and vision-language understanding. Publications at CVPR, ECCV, EACL, and IJCAI.'
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    block: 'navbar'
    fixed_to_top: true
    show_search: true
    show_theme_chooser: true
    logo:
      text: 'Quang Nguyen'

# Site footer
footer:
  copyright:
    # `{year}` is replaced with the current year at build time, so the range
    # stays current on its own. 2025 is the year the site was first published.
    notice: '© 2025–{year} Van-Quang Nguyen. All rights reserved.'
    license:
      enable: false
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: false
  privacy_pack:
    enable: false
